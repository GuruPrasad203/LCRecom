<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Adaptive Coding RL — Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
      href="{{ url_for('static', filename='bootstrap.min.css') }}">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --card-bg: #ffffff;
            --card-bg-subtle: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-color, #f8fafc);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', sans-serif;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--primary-dark);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .nav-link {
            color: var(--text-secondary) !important;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin: 0 0.25rem;
        }

        .nav-link.active {
            color: var(--primary) !important;
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-link:hover {
            color: var(--primary) !important;
        }

        .card {
            border: none;
            border-radius: 16px;
            background: var(--card-bg);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.15);
        }

        .bg-subtle {
            background: var(--card-bg-subtle);
        }

            .bg-subtle .placeholder-color {
                color: #cbd5e1;
            }

        .btn-outline {
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-chip {
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            margin: 0 0.25rem 0.25rem 0;
            transition: all 0.2s ease;
        }

        .filter-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .filter-chip:hover:not(.active) {
            border-color: var(--primary);
        }

        .stat-card {
            padding: 1.5rem;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .placeholder-card {
            aspect-ratio: 16/9;
            background: var(--card-bg-subtle);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-style: italic;
        }

        .chart-placeholder {
            aspect-ratio: 16/9;
            background: var(--card-bg-subtle);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .table th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 2px solid var(--border) !important;
        }

        .table td {
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border) !important;
        }

        .badge-custom {
            font-size: 0.75rem;
            padding: 0.35rem 0.65rem;
        }

        .progress {
            height: 0.5rem;
            border-radius: 0.25rem;
        }

        .accordion-button {
            font-weight: 500;
            color: var(--text-primary);
        }

        .accordion-button:not(.collapsed) {
            background: rgba(99, 102, 241, 0.03);
        }

        .dropdown-item {
            font-size: 0.875rem;
        }

        .dropdown-item:hover {
            background: var(--bg-color);
        }

        @media (max-width: 768px) {
            .nav-link {
                padding: 0.5rem;
            }

            .stat-value {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top"
         style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%) !important;">
        <div class="container">
            <a class="navbar-brand" href="/"
               style="font-family: 'Space Grotesk', sans-serif; font-weight: 700;">
                <i class="bi bi-brain"></i>
                Adaptive Coding RL
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarnav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarnav">
                <ul class="navbar-nav ms-auto">
                    {% for item in nav_items %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == NAV_ROUTES[item] %}active{% endif %}"
                           href="{{ url_for(NAV_ROUTES[item]) }}">{{ item }}</a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="pt-5 pb-5">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

<script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <script>
        // Active nav highlight on scroll
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-link');
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    const id = entry.target.getAttribute('id');
                    const isVisible = entry.isIntersecting;
                    navLinks.forEach(link => {
                        link.classList.toggle('active', link.getAttribute('href') === '#' + id && isVisible);
                    });
                });
            }, { section: { thresholds: 0.3 } });

            document.querySelectorAll('.section').forEach(section => {
                observer.observe(section);
            });
        });

        // Chip filter interaction
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip.active').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Collapse accordion animation
        document.querySelectorAll('.accordion-button').forEach(btn => {
            btn.addEventListener('click', function() {
                const card = this.closest('.accordion-item');
                card.classList.toggle('collapsed');
            });
        });
    </script>
</body>
</html>
